name: Build TgClient APK

# Dijalankan manual dari tab Actions. Saat "Run workflow" kamu akan
# diminta mengisi 1 kolom: link download tdlib-android-output.zip
# dari repo build TDLib sebelumnya.
on:
  workflow_dispatch:
    inputs:
      tdlib_zip_url:
        description: 'Direct download URL tdlib-android-output.zip'
        required: true
        type: string

permissions:
  contents: write # perlu untuk membuat Release berisi APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4

      - name: Ekstrak project TgClient
        run: unzip -o tgclient-project.zip

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install komponen Android SDK yang dibutuhkan
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Download hasil build TDLib
        run: |
          curl -L "${{ inputs.tdlib_zip_url }}" -o tdlib-output.zip
          unzip -o tdlib-output.zip -d tdlib-output

      - name: Salin binary (.so) & source Java TDLib ke project
        run: |
          mkdir -p tgclient/app/src/main/jniLibs
          cp -r tdlib-output/libs/* tgclient/app/src/main/jniLibs/
          mkdir -p tgclient/app/src/main/java
          cp -r tdlib-output/java/* tgclient/app/src/main/java/

      - name: Isi API_ID & API_HASH dari GitHub Secrets
        env:
          TDLIB_API_ID: ${{ secrets.TDLIB_API_ID }}
          TDLIB_API_HASH: ${{ secrets.TDLIB_API_HASH }}
        run: |
          CONFIG_FILE=tgclient/app/src/main/java/com/tgclient/app/tdlib/TdlibConfig.kt
          sed -i "s/const val API_ID: Int = 0/const val API_ID: Int = ${TDLIB_API_ID}/" "$CONFIG_FILE"
          sed -i "s/const val API_HASH: String = \"\"/const val API_HASH: String = \"${TDLIB_API_HASH}\"/" "$CONFIG_FILE"

      - name: Build APK debug
        working-directory: tgclient
        run: gradle assembleDebug --stacktrace

      - name: Temukan file APK hasil build
        id: find_apk
        run: |
          APK_PATH=$(find tgclient/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Ditemukan: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Buat Release berisi APK (bisa diunduh dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: TgClient APK build #${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk_path }}
